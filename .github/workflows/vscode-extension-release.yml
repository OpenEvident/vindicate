name: Release VS Code Extension

# Triggered by a vscode-v* tag push — created by tag-release.yml after a
# "chore(release): vscode-extension vX.Y.Z" PR is merged to main. Builds a
# universal VSIX on Linux (all keyring platforms bundled) and publishes it
# as a GitHub Release.
on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write

concurrency:
  group: release-vscode-extension
  cancel-in-progress: false

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          echo "value=${GITHUB_REF_NAME#vscode-v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension bundles
        run: pnpm --filter vindicate run build

      - name: Verify universal release bundle
        run: pnpm --filter vindicate run verify:bundle

      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: pnpm exec vsce package --no-dependencies --allow-missing-repository

      - name: Write checksum
        working-directory: apps/vscode-extension
        run: |
          set -euo pipefail
          VSIX="vindicate-${{ steps.version.outputs.value }}.vsix"
          test -f "$VSIX"
          sha256sum "$VSIX" > "${VSIX}.sha256"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vindicate-vscode-v${{ steps.version.outputs.value }}
          path: |
            apps/vscode-extension/vindicate-${{ steps.version.outputs.value }}.vsix
            apps/vscode-extension/vindicate-${{ steps.version.outputs.value }}.vsix.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vindicate-vscode-v${{ needs.build.outputs.version }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: VS Code Extension v${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            ## Vindicate VS Code Extension v${{ needs.build.outputs.version }}

            Universal VSIX (Windows, macOS, Linux). Built on `ubuntu-latest`.

            Install: download `vindicate-${{ needs.build.outputs.version }}.vsix` and use
            **Install from VSIX…** in VS Code, Cursor, Antigravity, or any other VS Code-compatible
            editor.

            Verify download integrity with the attached `.sha256` file.
          files: release/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
