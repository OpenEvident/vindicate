name: Release VS Code Extension

# Builds a universal VSIX on Linux (all keyring platforms bundled) and
# publishes it as a GitHub Release. Not triggered by a tag push directly —
# tag-release.yml calls this as a job right after it creates the tag (see
# that file for why). workflow_dispatch is kept as a manual escape hatch to
# rebuild an existing vscode-v* tag on demand.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (matches an existing vscode-v* tag, e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-vscode-extension
  cancel-in-progress: false

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: vscode-v${{ inputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension bundles
        run: pnpm --filter vindicate run build

      - name: Verify universal release bundle
        run: pnpm --filter vindicate run verify:bundle

      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: pnpm exec vsce package --no-dependencies --allow-missing-repository

      - name: Write checksum
        working-directory: apps/vscode-extension
        run: |
          set -euo pipefail
          VSIX="vindicate-${{ inputs.version }}.vsix"
          test -f "$VSIX"
          sha256sum "$VSIX" > "${VSIX}.sha256"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vindicate-vscode-v${{ inputs.version }}
          path: |
            apps/vscode-extension/vindicate-${{ inputs.version }}.vsix
            apps/vscode-extension/vindicate-${{ inputs.version }}.vsix.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vindicate-vscode-v${{ inputs.version }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: vscode-v${{ inputs.version }}
          name: VS Code Extension v${{ inputs.version }}
          generate_release_notes: true
          body: |
            ## Vindicate VS Code Extension v${{ inputs.version }}

            Universal VSIX (Windows, macOS, Linux). Built on `ubuntu-latest`.

            Install: download `vindicate-${{ inputs.version }}.vsix` and use
            **Install from VSIX…** in VS Code, Cursor, Antigravity, or any other VS Code-compatible
            editor.

            Verify download integrity with the attached `.sha256` file.
          files: release/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
