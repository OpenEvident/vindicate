# Optional overrides via Repository settings > Pipelines > Repository variables:
# BASE_URL, WORKERS, RETRIES (read by playwright.config.ts). No other variables needed.
#
# Results: the "Tests" tab on each pipeline run, plus downloadable playwright-report/test-results
# artifacts below.

image: node:22
options: { max-time: 40 }

pipelines:
  branches:
    main: &pipeline_steps
      - parallel:
          fail-fast: false
          steps:
          - step:
              name: Shard 1 / 2
              caches: [ node ]
              script:
              - 'set +e; SHARD_EXIT=0; npm ci || SHARD_EXIT=$?; [ "$SHARD_EXIT" -eq 0 ] && { npx playwright install chromium --with-deps || SHARD_EXIT=$?; }; [ "$SHARD_EXIT" -eq 0 ] && { npx playwright test --shard=1/2 || SHARD_EXIT=$?; }; mkdir -p artifacts/blob-report-1 artifacts/status; [ -d blob-report ] && cp -R blob-report/. artifacts/blob-report-1/; echo "$SHARD_EXIT" > artifacts/status/shard-1.exit; echo "Shard 1 exit: $SHARD_EXIT"; exit 0'
              artifacts: [ artifacts/** ]

          - step:
              name: Shard 2 / 2
              caches: [ node ]
              script:
              - 'set +e; SHARD_EXIT=0; npm ci || SHARD_EXIT=$?; [ "$SHARD_EXIT" -eq 0 ] && { npx playwright install chromium --with-deps || SHARD_EXIT=$?; }; [ "$SHARD_EXIT" -eq 0 ] && { npx playwright test --shard=2/2 || SHARD_EXIT=$?; }; mkdir -p artifacts/blob-report-2 artifacts/status; [ -d blob-report ] && cp -R blob-report/. artifacts/blob-report-2/; echo "$SHARD_EXIT" > artifacts/status/shard-2.exit; echo "Shard 2 exit: $SHARD_EXIT"; exit 0'
              artifacts: [ artifacts/** ]

      - step:
          name: Merge Reports
          caches: [ node ]
          script:
          - 'set +e; FAILED=0; npm ci || FAILED=1; mkdir -p all-blob-reports test-results; for d in artifacts/blob-report-*; do [ -d "$d" ] && cp -R "$d"/. all-blob-reports/; done; export PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/results.xml; npx playwright merge-reports --reporter=html,junit ./all-blob-reports; [ $? -ne 0 ] && FAILED=1; for f in artifacts/status/*.exit; do [ -f "$f" ] || continue; code="$(cat "$f" 2>/dev/null || echo 1)"; [ "$code" -ne 0 ] && { FAILED=1; echo "Detected failed shard from $f: $code"; }; done; if [ "$FAILED" -ne 0 ]; then echo "Pipeline marked failed - see the Tests tab, or download the test-results/playwright-report artifacts."; exit 1; fi; exit 0'
          artifacts: [ test-results/**, playwright-report/** ]

  pull-requests:
    main: *pipeline_steps

  custom:
    vindicate-playwright-tests: *pipeline_steps
